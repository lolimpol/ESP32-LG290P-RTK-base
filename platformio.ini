; ESP32 RTK base station - PlatformIO project
[env:esp32dev]
platform  = espressif32@6.9.0          ; = arduino-esp32 2.0.17 (the version this code was written against)
board     = esp32dev
framework = arduino
board_build.f_cpu        = 160000000L  ; keep in sync with CPU_FREQ_MHZ in UserConfig.h
board_build.flash_mode   = dio
board_build.partitions   = partitions.csv
monitor_speed = 115200
extra_scripts = pre:tools/embed_web.py
build_flags =
  -DCORE_DEBUG_LEVEL=1                 ; IDF/Arduino logging: errors only
  -DARDUINO_LOOP_STACK_SIZE=6144
  -Os
  -Wall -Wno-unused-variable
